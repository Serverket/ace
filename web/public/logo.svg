<svg width="100%" height="100%" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Golden Gradient for the Logo Mark -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" /> <!-- amber-400 -->
      <stop offset="50%" stop-color="#f59e0b" /> <!-- amber-500 -->
      <stop offset="100%" stop-color="#ea580c" /> <!-- orange-600 -->
    </linearGradient>
    
    <!-- Secondary Golden Gradient for 3D/Fold effect -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Left Ribbon -->
    <path d="M 120 20 L 0 260 H 80 L 160 100 Z" fill="url(#gold)" />
    
    <!-- Right Ribbon -->
    <path d="M 120 20 L 240 260 H 160 L 80 100 Z" fill="url(#gold-dark)" opacity="0.9" />

    <!-- Crossbar (Perfectly Symmetrical Parallelogram) -->
    <path d="M 80 180 H 160 L 180 220 H 60 Z" fill="url(#gold)" />
    
    <!-- Top sphere -->
    <circle cx="120" cy="20" r="16" fill="#fcd34d" />
  </g>
</svg>
