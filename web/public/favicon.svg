<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ace-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ace-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Diamond / Shield Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0f172a" stroke="url(#ace-grad)" stroke-width="2.5" />
  
  <!-- Subtle Internal Grid Matrix Accent -->
  <circle cx="16" cy="16" r="1.5" fill="#334155" />
  <circle cx="48" cy="16" r="1.5" fill="#334155" />
  <circle cx="16" cy="48" r="1.5" fill="#334155" />
  <circle cx="48" cy="48" r="1.5" fill="#334155" />

  <!-- The "A" & Exchange Rate Delta Emblem -->
  <!-- Left leg -->
  <path d="M22 45L32 18L37 31" stroke="url(#ace-glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Dynamic Crossbar with Pulse / Currency Arrow -->
  <path d="M19 35H41" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1" />
  <!-- Right dynamic trading arrow (showing exchange velocity) -->
  <path d="M37 31L43 45" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" />
  <!-- Currency Exchange Wave / Beacon -->
  <circle cx="32" cy="18" r="3" fill="#38bdf8" filter="url(#glow)" />
  <path d="M26 38L32 32L38 38" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>